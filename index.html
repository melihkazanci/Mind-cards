<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İngilizce Hafıza Kartları (Flashcards)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f4;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        .counter { color: #7f8c8d; margin-bottom: 20px; font-size: 14px; }
        
        /* Kart Tasarımı */
        .flashcard {
            background: white;
            height: 250px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: pointer;
            position: relative;
            transition: transform 0.3s;
            user-select: none;
            border: 2px solid #e2e8f0;
        }
        .flashcard:hover {
            border-color: #3498db;
        }
        .card-label {
            position: absolute;
            top: 15px;
            font-size: 12px;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card-content {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .card-sub {
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
            font-style: italic;
        }
        
        /* Kontrol Butonları */
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 25px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .btn-prev { background-color: #95a5a6; }
        .btn-prev:hover { background-color: #7f8c8d; }
        .btn-next { background-color: #3498db; }
        .btn-next:hover { background-color: #2980b9; }
        .flip-hint {
            margin-top: 15px;
            font-size: 13px;
            color: #e67e22;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Notlar Hafıza Kartları</h2>
    <div class="counter" id="counterText">Kart 1 / 0</div>

    <div class="flashcard" id="card" onclick="flipCard()">
        <div class="card-label" id="cardLabel">İngilizce</div>
        <div class="card-content" id="cardContent">Yükleniyor...</div>
        <div class="card-sub" id="cardSub"></div>
    </div>
    
    <div class="flip-hint">👆 Kartı çevirmek için üzerine dokunun</div>

    <div class="btn-group">
        <button class="btn-prev" onclick="prevCard()">⬅ Önceki</button>
        <button class="btn-next" onclick="nextCard()">Sonraki ➡</button>
    </div>
</div>

    let currentIndex = 0;
    let isFlipped = false;

    function updateCard() {
        const cardData = flashcards[currentIndex];
        isFlipped = false;
        
        document.getElementById("cardLabel").innerText = "İngilizce";
        document.getElementById("cardContent").innerText = cardData.en;
        document.getElementById("cardSub").innerText = cardData.sub ? `(${cardData.sub})` : "";
        document.getElementById("counterText").innerText = `Kart ${currentIndex + 1} / ${flashcards.length}`;
    }

    function flipCard() {
        const cardData = flashcards[currentIndex];
        isFlipped = !isFlipped;
        
        if (isFlipped) {
            document.getElementById("cardLabel").innerText = "Türkçe Anlamı";
            document.getElementById("cardContent").innerText = cardData.tr;
            document.getElementById("cardSub").innerText = "";
        } else {
            document.getElementById("cardLabel").innerText = "İngilizce";
            document.getElementById("cardContent").innerText = cardData.en;
            document.getElementById("cardSub").innerText = cardData.sub ? `(${cardData.sub})` : "";
        }
    }

    function nextCard() {
        currentIndex = (currentIndex + 1) % flashcards.length;
        updateCard();
    }

    function prevCard() {
        currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
        updateCard();
    }

    // İlk kartı yükle
    updateCard();
</script>
